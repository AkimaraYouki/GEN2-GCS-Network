# /etc/dnsmasq.d/gcs-lan.conf
# GEN2 ground-station LAN: DHCP only on eth0 (Pi is gateway; NAT via USB tether in nftables)
interface=eth0
bind-dynamic
port=0
dhcp-authoritative

# 고정 주소(.1 Pi, .2 EAP225, .10 Jetson)는 DHCP 대역 밖에 둡니다.
dhcp-range=192.168.50.100,192.168.50.200,255.255.255.0,12h

# 인터넷 공유를 안 쓰면 아래 두 줄 대신 `dhcp-option=option:router` 한 줄만 둡니다.
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8

# EAP225를 찾은 뒤 MAC을 바꿔서 추가 (docs/full-setup.md Step 4)
# dhcp-host=aa:bb:cc:dd:ee:ff,192.168.50.2,eap225
